<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum & Classical Harmonic Oscillator Sim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Control Settings Sidebar -->
        <aside class="sidebar">
            <h2>Oscillator Settings</h2>
            
            <div class="control-group">
                <label for="mass">Mass ($m$): <span id="mass-val">2.0</span> kg</label>
                <input type="range" id="mass" min="0.5" max="5.0" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <label for="springK">Spring Constant ($k$): <span id="k-val">15</span> N/m</label>
                <input type="range" id="springK" min="5" max="50" step="1" value="15">
            </div>

            <div class="control-group">
                <label for="damping">Damping ($\beta$): <span id="damping-val">0.1</span></label>
                <input type="range" id="damping" min="0.0" max="2.0" step="0.05" value="0.1">
            </div>

            <button id="resetBtn">Reset Block Position</button>
            
            <div class="stats-panel">
                <h3>Live Metrics</h3>
                <p>Angular Freq ($\omega$): <span id="omega-val">0.00</span> rad/s</p>
                <p>Period ($T$): <span id="period-val">0.00</span> s</p>
            </div>
        </aside>

        <!-- Main Display Canvas -->
        <main class="canvas-area">
            <h1>Harmonic Motion Lab</h1>
            <canvas id="oscillatorCanvas" width="700" height="450"></canvas>
        </main>
    </div>
    <script src="simulation.js"></script>
</body>
</html>
